name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  api:
    name: API — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: unwelts_test
          POSTGRES_USER: unwelts
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unwelts"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

      - name: Run migrations
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://unwelts:testpassword@localhost:5432/unwelts_test
          REDIS_URL: redis://localhost:6379/0
          FINGERPRINT_SECRET: test-secret-for-ci
          MOOD_SUBMISSION_DAILY_LIMIT: "1"
        run: alembic upgrade head

      - name: Test (pytest)
        env:
          APP_ENV: development
          DEBUG: "false"
          DATABASE_URL: postgresql+asyncpg://unwelts:testpassword@localhost:5432/unwelts_test
          REDIS_URL: redis://localhost:6379/0
          FINGERPRINT_SECRET: test-secret-for-ci
          MOOD_SUBMISSION_DAILY_LIMIT: "1"
        run: pytest --cov=app --cov-report=term-missing

  web:
    name: Web — Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
