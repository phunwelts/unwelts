version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: unwelts_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: unwelts
      POSTGRES_USER: unwelts
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unwelts"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: unwelts_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass localpassword
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "localpassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: unwelts_api
    restart: unless-stopped
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://unwelts:localpassword@db:5432/unwelts
      REDIS_URL: redis://:localpassword@redis:6379/0
      FINGERPRINT_SECRET: local-dev-secret-not-used-in-production
      MOOD_SUBMISSION_DAILY_LIMIT: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: unwelts_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  pgdata:

